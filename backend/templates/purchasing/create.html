{% extends "base.html" %}
{% block title %}New Purchase | Order-to-Audit{% endblock %}
{% block content %}
<div class="card">
  <h2>Record Purchase Receipt</h2>
  <form method="post">
    {% csrf_token %}
    <div class="grid">
      <div class="form-row">
        <label for="supplier_id">Supplier</label>
        <select name="supplier_id" id="supplier_id" required>
          {% for sup in suppliers %}
            <option value="{{ sup.id }}">{{ sup.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label for="invoice_number">Supplier Invoice Number</label>
        <input type="text" name="invoice_number" id="invoice_number" required placeholder="INV-2026-001">
      </div>
      <div class="form-row">
        <label for="date">Purchase Date</label>
        <input type="date" name="date" id="date" value="{{ today }}" required>
      </div>
    </div>

    <h3>Line Items</h3>
    <table id="lines-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Unit</th>
          <th>Rate / Unit (Rs)</th>
          <th>Batch (Optional)</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>
            <select name="item_id" required>
              <option value="">-- Select item --</option>
              {% for item in items %}
                <option value="{{ item.id }}">{{ item.sku }} - {{ item.name }}</option>
              {% endfor %}
            </select>
          </td>
          <td><input type="text" name="qty" placeholder="60" required></td>
          <td>
            <select name="unit_id" required>
              {% for u in units %}
                <option value="{{ u.id }}">{{ u.code }}</option>
              {% endfor %}
            </select>
          </td>
          <td><input type="text" name="unit_rate" placeholder="45.00" required></td>
          <td><input type="text" name="batch" placeholder="Optional"></td>
        </tr>
      </tbody>
    </table>

    <div style="margin-top:1rem; display:flex; gap:0.6rem; flex-wrap:wrap;">
      <button type="submit" name="action" value="save_and_post" class="btn">Save &amp; Post to Ledger</button>
      <button type="submit" name="action" value="save_draft" class="btn btn-secondary">Save as Draft</button>
      <a href="/purchasing/" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
